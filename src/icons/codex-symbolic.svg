<!-- An original symbolic mark for Codex, not OpenAI's asset: a six-petalled
     knot-rosette, one filled path with the centre cut out by a reversed circle
     under nonzero winding, so the hole costs no second colour. The interlacing
     of a real knot is dropped on purpose, being mud below about 24px; the
     petals and the open centre are what carry the silhouette at panel size. -->
