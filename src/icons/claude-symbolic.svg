<!-- An original symbolic mark for Claude, not Anthropic's asset: a radial burst
     of eight spokes, each widening outwards from a common centre. Drawn as one
     filled path so the shell's symbolic recolouring has a single silhouette to
     tint, and kept to eight spokes because more than that closes up at 16px. -->
